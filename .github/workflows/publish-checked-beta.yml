name: Publish checked BETA assets
on:
  push:
    branches: [main]
    paths: ['.github/release-candidate.json']
  workflow_dispatch:
    inputs:
      candidate_url:
        description: HTTPS URL of the audited release bundle (no private runtime data)
        required: true
      candidate_sha256:
        description: SHA-256 of the audited bundle
        required: true
permissions:
  contents: read
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Download and verify the reviewed candidate
        env:
          CANDIDATE_URL: ${{ inputs.candidate_url }}
          CANDIDATE_SHA256: ${{ inputs.candidate_sha256 }}
        run: |
          python - <<'PY'
          import hashlib, os, pathlib, re, urllib.request, zipfile
          candidate = pathlib.Path('.github/release-candidate.json')
          config = __import__('json').loads(candidate.read_text()) if candidate.exists() else {}
          url = os.environ.get('CANDIDATE_URL') or config.get('url', '')
          digest = os.environ.get('CANDIDATE_SHA256') or config.get('sha256', '')
          assert url.startswith('https://') and re.fullmatch('[0-9a-f]{64}', digest)
          urllib.request.urlretrieve(url, '/tmp/candidate.zip')
          assert hashlib.sha256(pathlib.Path('/tmp/candidate.zip').read_bytes()).hexdigest() == digest
          with zipfile.ZipFile('/tmp/candidate.zip') as z:
              assert z.testzip() is None
              assert all('/' not in n and '\\' not in n and n not in ('.', '..') for n in z.namelist())
              z.extractall('/tmp/release')
          manifest = __import__('json').loads(pathlib.Path('/tmp/release/release_manifest.json').read_text())
          version = manifest['version']
          assert re.fullmatch(r'\d+\.\d+\.\d+-beta\.\d+', version)
          assert manifest['repository'] == 'lby749/Open-QQ-Dot'
          assert manifest['status'] == 'BETA' and manifest['private_runtime_data_included'] is False
          bundle_name = f'OpenQQDot-Release-{version}-All.zip'
          __import__('shutil').copyfile('/tmp/candidate.zip', '/tmp/release/' + bundle_name)
          pathlib.Path('/tmp/release/' + bundle_name + '.sha256').write_text(f'{digest}  {bundle_name}\n')
          with open(os.environ['GITHUB_ENV'], 'a') as env:
              env.write(f'RELEASE_VERSION={version}\n')
          with zipfile.ZipFile(f'/tmp/release/OpenQQDot-Source-{version}.zip') as z:
              assert z.testzip() is None
              for n in z.namelist():
                  p = pathlib.PurePosixPath(n)
                  assert p.parts[0] == 'Open-QQ-Dot' and '..' not in p.parts
                  rel = pathlib.Path(*p.parts[1:])
                  if not rel.parts or rel.parts[0] == '.github':
                      continue
                  dest = pathlib.Path.cwd() / rel
                  dest.parent.mkdir(parents=True, exist_ok=True)
                  dest.write_bytes(z.read(n))
                  if str(rel) in ('start.sh', 'Open QQ Dot.command'):
                      dest.chmod(0o755)
          PY
      - name: Check source and every asset
        run: |
          python -X utf8 tools/package_release.py --check-only
          python -X utf8 tools/check_license.py
          python -X utf8 tools/verify_release_archive.py --source "/tmp/release/OpenQQDot-Source-${RELEASE_VERSION}.zip"
          python -X utf8 tools/verify_release_archive.py "/tmp/release/OpenQQDot-Portable-Windows-x64-${RELEASE_VERSION}.zip"
          cd /tmp/release
          sha256sum -c SHA256SUMS.txt
          sha256sum -c "OpenQQDot-Release-${RELEASE_VERSION}-All.zip.sha256"
      - name: Commit public source and publish preview assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh auth setup-git
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .
          git commit -m "Release checked Open QQ Dot ${RELEASE_VERSION} source and documentation"
          git push origin HEAD:main
          notes=$(python -c "import os;print('docs/RELEASE_BETA'+os.environ['RELEASE_VERSION'].rsplit('.',1)[-1]+'.md')")
          gh release create "v${RELEASE_VERSION}" /tmp/release/* --prerelease --target "$(git rev-parse HEAD)" --title "Open QQ Dot ${RELEASE_VERSION} · BETA 测试版" --notes-file "$notes"

