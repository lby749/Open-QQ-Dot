name: Publish checked BETA assets
on:
  workflow_dispatch:
    inputs:
      candidate_url:
        description: HTTPS URL of the audited release bundle (no private runtime data)
        required: true
      candidate_sha256:
        description: SHA-256 of the audited bundle
        required: true
permissions:
  contents: read
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Download and verify the reviewed candidate
        env:
          CANDIDATE_URL: ${{ inputs.candidate_url }}
          CANDIDATE_SHA256: ${{ inputs.candidate_sha256 }}
        run: |
          python - <<'PY'
          import hashlib, os, pathlib, re, urllib.request, zipfile
          url, digest = os.environ['CANDIDATE_URL'], os.environ['CANDIDATE_SHA256']
          assert url.startswith('https://') and re.fullmatch('[0-9a-f]{64}', digest)
          urllib.request.urlretrieve(url, '/tmp/candidate.zip')
          assert hashlib.sha256(pathlib.Path('/tmp/candidate.zip').read_bytes()).hexdigest() == digest
          with zipfile.ZipFile('/tmp/candidate.zip') as z:
              assert z.testzip() is None
              assert all('/' not in n and '\\' not in n and n not in ('.', '..') for n in z.namelist())
              z.extractall('/tmp/release')
          with zipfile.ZipFile('/tmp/release/OpenQQDot-Source-1.0.0-beta.3.zip') as z:
              assert z.testzip() is None
              for n in z.namelist():
                  p = pathlib.PurePosixPath(n)
                  assert p.parts[0] == 'Open-QQ-Dot' and '..' not in p.parts
                  rel = pathlib.Path(*p.parts[1:])
                  if not rel.parts or str(rel).startswith('.github/workflows/'):
                      continue
                  dest = pathlib.Path.cwd() / rel
                  dest.parent.mkdir(parents=True, exist_ok=True)
                  dest.write_bytes(z.read(n))
                  if str(rel) in ('start.sh', 'Open QQ Dot.command'):
                      dest.chmod(0o755)
          PY
      - name: Check source and every asset
        run: |
          python -X utf8 tools/package_release.py --check-only
          python -X utf8 tools/check_license.py
          cd /tmp/release
          sha256sum -c SHA256SUMS.txt
      - name: Commit public source and publish preview assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh auth setup-git
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .
          git commit -m 'Release audited Open QQ Dot 1.0.0-beta.3 source and documentation'
          git push origin HEAD:main
          gh release create v1.0.0-beta.3 /tmp/release/* --prerelease --target "$(git rev-parse HEAD)" --title 'Open QQ Dot 1.0.0-beta.3 · BETA 测试版' --notes-file docs/RELEASE_BETA3.md
