name: Windows release checks
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  regression:
    runs-on: windows-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        python: ['3.11', '3.13']
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install -r requirements-ui.txt pytest
      - run: python -m pip install --no-deps -r requirements-ui-qfluent.txt
      - name: License and third-party notices
        run: python -X utf8 tools/check_license.py
      - name: Test module import check
        run: python -X utf8 -m pytest --collect-only -q tests
      - name: Isolated model-free regression
        run: python -X utf8 tools/run_release_checks.py
      - name: Release candidate secret and file scan
        run: python -X utf8 tools/package_release.py --check-only
