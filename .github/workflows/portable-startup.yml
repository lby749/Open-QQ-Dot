name: Portable startup checks
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  startup:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest, macos-14]
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: python -m pip install pytest psutil
      - run: python -X utf8 -m pytest tests/test_platform_runtime.py -q
      - name: POSIX launcher syntax
        if: runner.os != 'Windows'
        run: sh -n start.sh && sh -n 'Open QQ Dot.command'
