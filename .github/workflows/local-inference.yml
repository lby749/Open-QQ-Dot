name: Portable local inference
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  cpu-and-policy:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest, macos-14]
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: CPU PyTorch on Windows and Linux
        if: runner.os != 'macOS'
        run: python -m pip install torch==2.7.1 --index-url https://download.pytorch.org/whl/cpu
      - name: Native PyTorch on macOS
        if: runner.os == 'macOS'
        run: python -m pip install torch==2.7.1
      - run: python -m pip install transformers==4.51.3 safetensors sentencepiece psutil numpy jsonschema pytest
      - run: python -X utf8 -m pytest -q tests/test_inference_devices.py tests/test_local_backend_cpu.py tests/test_small_models.py tests/test_message_classifier.py
