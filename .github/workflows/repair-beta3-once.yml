name: Repair audited BETA3 source and notes
on:
  push:
    branches: [main]
    paths: ['.github/workflows/repair-beta3-once.yml']
permissions:
  contents: read
jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Verify clean replacement artifacts
        env:
          REPAIR_URL: https://pet-courts-generating-clouds.trycloudflare.com/repair.zip
          REPAIR_SHA256: 0f4bdbc8b4d41c617db1b15a8a42f4243f69f8cf208fd24a64f0e0001c181704
        run: |
          python - <<'PY'
          import hashlib, os, pathlib, urllib.request, zipfile
          urllib.request.urlretrieve(os.environ['REPAIR_URL'], '/tmp/repair.zip')
          assert hashlib.sha256(pathlib.Path('/tmp/repair.zip').read_bytes()).hexdigest() == os.environ['REPAIR_SHA256']
          with zipfile.ZipFile('/tmp/repair.zip') as z:
              assert z.testzip() is None
              assert set(z.namelist()) == {'OpenQQDot-Source-1.0.0-beta.3.zip', 'OpenQQDot-Source-1.0.0-beta.3.zip.sha256', 'Release-notes.md', 'release_manifest.json', 'SHA256SUMS.txt'}
              z.extractall('/tmp/replacement')
          sums = dict((line.split('  ', 1)[1], line.split('  ', 1)[0]) for line in pathlib.Path('/tmp/replacement/SHA256SUMS.txt').read_text().splitlines())
          for p in pathlib.Path('/tmp/replacement').iterdir():
              if p.name != 'SHA256SUMS.txt':
                  assert hashlib.sha256(p.read_bytes()).hexdigest() == sums[p.name], p.name
          PY
          python -X utf8 tools/package_release.py --check-only
          python -X utf8 tools/verify_release_archive.py --source /tmp/replacement/OpenQQDot-Source-1.0.0-beta.3.zip
          python -X utf8 tools/check_license.py
      - name: Replace source package and synchronize introduction
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          EXPECTED_OLD_TAG: 4040402874697a675f0db41fde2d59e41b27a637
        run: |
          gh release upload v1.0.0-beta.3 /tmp/replacement/* --clobber
          gh release edit v1.0.0-beta.3 --notes-file docs/RELEASE_BETA3.md
          current=$(gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/v1.0.0-beta.3" --jq .object.sha)
          test "$current" = "$EXPECTED_OLD_TAG"
          gh api --method PATCH "repos/$GITHUB_REPOSITORY/git/refs/tags/v1.0.0-beta.3" -f sha="$GITHUB_SHA" -F force=true >/dev/null
