name: Full regression (manual)
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  full-tests:
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: python -m pip install -r requirements-ui.txt pytest pypdf onnx
      - name: License check
        run: python -X utf8 tools/check_license.py
      - name: Full test suite
        run: python -X utf8 -m pytest -q tests
