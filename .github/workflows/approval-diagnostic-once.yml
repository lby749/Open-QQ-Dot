name: Diagnose Windows approval failure
on:
  push:
    paths: ['.github/workflows/approval-diagnostic-once.yml']
permissions:
  contents: read
jobs:
  approval:
    runs-on: windows-latest
    timeout-minutes: 12
    env:
      PYTHONUTF8: '1'
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements-ui-core.txt pytest
      - run: python -m pip install --no-deps -r requirements-ui-qfluent.txt
      - run: python -X utf8 -m pytest -vv -s tests/test_task_loop_closure.py::CrossProcessApprovalTests::test_decision_recorded_by_another_os_process_releases_the_waiter
