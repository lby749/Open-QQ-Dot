<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#eff6ff">
<title>Open QQ Dot · 好友小屋</title>
<link rel="icon" type="image/png" href="/app-icon.png">
<link rel="apple-touch-icon" href="/app-icon.png">
<style>
/* 2026-10-12 user: the phone app's own look (Material 3, ui/theme/Color.kt). Inside the app the colours are replaced
   by the app's current scheme (dynamic colour on Android 12+), see FriendHouseActivity.themeScript. */
:root{--primary:#2563eb;--on-primary:#fff;--primary-container:#dbeafe;--on-primary-container:#1e3a8a;
--secondary-container:#e0edff;--on-secondary-container:#1e3a8a;--surface:#eff6ff;--surface-low:#fff;
--surface-container:#fff;--surface-high:#eaf2ff;--on-surface:#0f172a;--on-surface-variant:#64748b;
--outline:#94a3b8;--outline-variant:#dbeafe;--error:#ba1a1a;--ok:#2e7d32;--inverse-surface:#1e3a8a;--inverse-on-surface:#fff}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;background:var(--surface);color:var(--on-surface);font:14px/20px Roboto,"Noto Sans SC","PingFang SC","Microsoft YaHei",sans-serif;letter-spacing:.25px;padding:env(safe-area-inset-top) 0 env(safe-area-inset-bottom)}
header{position:sticky;top:0;z-index:2;background:var(--surface);min-height:64px;padding:8px 8px 8px 16px;display:flex;align-items:center;gap:8px}
header h1{font-size:22px;line-height:28px;font-weight:400;margin:0;flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
body.in-app header{display:none}
main{padding:8px 16px 96px;max-width:720px;margin:0 auto}
body.chat-page main{padding-bottom:176px}
.card{background:var(--surface-low);border-radius:12px;padding:16px;margin-bottom:12px}
.card h2{font-size:16px;line-height:24px;font-weight:500;letter-spacing:.15px;margin:0 0 8px}
.muted{color:var(--on-surface-variant);font-size:12px;line-height:16px;letter-spacing:.4px}
button{font-family:inherit;font-size:14px;line-height:20px;font-weight:500;letter-spacing:.1px;border:0;background:var(--secondary-container);color:var(--on-secondary-container);border-radius:20px;padding:0 24px;min-height:40px;cursor:pointer}
button.primary{background:var(--primary);color:var(--on-primary)}
button:active{filter:brightness(.92)}
button:disabled{opacity:.38}
header button{background:none;color:var(--primary);padding:0 12px}
a{font-weight:500;text-decoration:none;display:inline-flex;align-items:center;min-height:40px;padding:0 24px;border-radius:20px;background:var(--primary);color:var(--on-primary);margin:8px 0}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.grow{flex:1}
.state{font-size:12px;line-height:16px;font-weight:500;padding:6px 12px;border-radius:8px;border:1px solid var(--outline-variant)}
.ok{color:var(--ok)}.bad{color:var(--error)}
pre{white-space:pre-wrap;word-break:break-word;margin:0;font-family:inherit;font-size:14px;line-height:20px}
.switch{display:flex;align-items:center;gap:16px;padding:12px 0;border-top:1px solid var(--outline-variant)}
.switch:first-of-type{border-top:0}
input[type=checkbox]{appearance:none;-webkit-appearance:none;flex:0 0 52px;width:52px;height:32px;margin:0;border-radius:16px;border:2px solid var(--outline);background:var(--surface-high);position:relative;transition:background .15s}
input[type=checkbox]::after{content:'';position:absolute;top:6px;left:6px;width:16px;height:16px;border-radius:50%;background:var(--outline);transition:all .15s}
input[type=checkbox]:checked{background:var(--primary);border-color:var(--primary)}
input[type=checkbox]:checked::after{top:2px;left:22px;width:24px;height:24px;background:var(--on-primary)}
nav.tabs{position:fixed;bottom:0;left:0;right:0;z-index:2;display:flex;background:var(--surface-container);padding:12px 0 calc(16px + env(safe-area-inset-bottom))}
nav.tabs button{flex:1;background:none;color:var(--on-surface-variant);padding:0;min-height:32px;font-size:12px;line-height:16px;letter-spacing:.5px;display:flex;justify-content:center}
nav.tabs button span{display:inline-block;padding:6px 12px;border-radius:16px}
nav.tabs button.on{color:var(--on-surface);font-weight:600}
nav.tabs button.on span{background:var(--secondary-container);color:var(--on-secondary-container)}
.bubble{max-width:85%;width:fit-content;padding:10px 16px;border-radius:20px;margin:4px 0;white-space:pre-wrap;word-break:break-word}
.them{background:var(--surface-high);border-bottom-left-radius:4px}
.me{background:var(--primary-container);color:var(--on-primary-container);margin-left:auto;border-bottom-right-radius:4px}
.bubble.model{background:#ecfdf5;color:#065f46;margin-right:auto;border:1px solid #a7f3d0;border-bottom-left-radius:4px}
.bubble.model-me{background:#dcfce7;color:#065f46;margin-left:auto;border:1px solid #86efac;border-bottom-right-radius:4px}
.stamp{font-size:11px;line-height:16px;color:var(--on-surface-variant);margin-top:12px}
.stamp.me{background:none;color:var(--on-surface-variant);text-align:right}
textarea{width:100%;min-height:50vh;font-family:inherit;font-size:14px;line-height:20px;padding:12px 16px;border-radius:4px;border:1px solid var(--outline);background:transparent;color:var(--on-surface)}
textarea:focus,.field>input:focus,.field>select:focus{outline:none;border:2px solid var(--primary)}
textarea.small{min-height:112px}
textarea.tall{min-height:260px}
.field{display:flex;align-items:flex-start;gap:12px;padding:8px 0}
.field>span{flex:0 0 84px;color:var(--on-surface-variant);font-size:12px;line-height:16px;padding-top:14px}
.field>input,.field>select{flex:1;min-width:0;font:inherit;padding:0 16px;border-radius:4px;border:1px solid var(--outline);background:transparent;color:var(--on-surface);min-height:48px}
.field>textarea{flex:1;min-width:0;min-height:48px}
.tnode{position:relative;padding:3px 6px 4px 22px;border-radius:8px}
.tnode.open{display:block}
.tnode:not(.open){display:inline-block;min-width:56px}
.tnode .tdot{position:absolute;left:4px;top:8px;width:14px;height:14px;border-radius:50%;border:2px solid;box-sizing:border-box;box-shadow:inset 0 0 0 3px var(--surface)}
.tnode.big .tdot{left:3px;top:7px;width:16px;height:16px}
.tnode .ttl{font-weight:600;line-height:20px}
.tnode .sub{font-size:12px;line-height:18px}
.tnode.open{background:rgba(37,99,235,.08)}
.tnode.kids::after{content:'';position:absolute;left:10px;top:24px;bottom:0;border-left:1.5px solid var(--outline)}
.tkids{margin-left:10px}
.tkids>.titem{position:relative;padding-left:6px}
.tkids>.titem::before{content:'';position:absolute;left:0;top:0;width:10px;height:15px;border-left:1.5px solid var(--outline);border-bottom:1.5px solid var(--outline);border-bottom-left-radius:8px}
.tkids>.titem:not(:last-child)::after{content:'';position:absolute;left:0;top:0;bottom:0;border-left:1.5px solid var(--outline)}
#toast{position:fixed;left:16px;right:16px;bottom:96px;z-index:3;background:var(--inverse-surface);color:var(--inverse-on-surface);padding:14px 16px;border-radius:4px;box-shadow:0 3px 6px rgba(0,0,0,.25);display:none}
.problem{border-top:1px solid var(--outline-variant);padding:12px 0}
.list button{display:flex;width:100%;justify-content:space-between;align-items:center;background:none;color:var(--on-surface);border-radius:0;padding:0 4px;min-height:56px;font-size:16px;line-height:24px;font-weight:400;border-top:1px solid var(--outline-variant)}
.list button:first-child{border-top:0}
details{border-top:1px solid var(--outline-variant);padding:4px 0}
summary{cursor:pointer;min-height:44px;display:flex;align-items:center;gap:8px;list-style:none}
summary::-webkit-details-marker{display:none}
details pre{margin:8px 0;font-size:13px}
.card h2+h2,.card pre+h2,.card div+h2{margin-top:16px}
.sticker{display:flex;gap:12px;align-items:flex-start;margin-bottom:8px}
.sticker img{flex:0 0 96px;width:96px;height:96px;object-fit:contain;border-radius:8px;background:var(--surface-high)}

/* Mobile Agent Console */
.agent-wrap{padding-bottom:120px}
.agent-topbar{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:10px}
.agent-select{min-width:0;min-height:40px;border-radius:10px;border:1px solid #dbeafe;background:#fff;font-size:13px;padding:0 10px;color:var(--on-surface)}
.agent-topbar>.agent-icon-btn:last-child{grid-column:1/-1}
.agent-icon-btn{min-height:40px;padding:0 12px;border-radius:10px;font-size:13px;border:1px solid #dbeafe;background:#fff;color:#1e3a8a;cursor:pointer;display:flex;align-items:center;justify-content:center;font-weight:500}
.agent-pill{display:flex;align-items:center;justify-content:space-between;background:#fff;border:1px solid #dbeafe;border-left:3px solid var(--primary);border-radius:12px;padding:10px 14px;margin-bottom:12px;cursor:pointer}
.agent-pill:active{filter:brightness(0.96)}
.agent-pill-info{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.agent-pill-badge{background:var(--primary-container);color:var(--on-primary-container);font-size:11px;font-weight:600;padding:2px 8px;border-radius:6px}
.agent-pill-effort{font-size:12px;color:var(--on-surface-variant);font-weight:500}
.agent-msg-list{display:flex;flex-direction:column;gap:8px;min-height:180px}
.agent-msg-assistant{background:#fff;border-radius:14px;padding:12px 14px;border:1px solid #dbeafe;border-left:3px solid var(--primary)}
.agent-msg-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:6px;font-size:12px;color:#1d4ed8}
.agent-msg-body{font-size:14px;line-height:22px;white-space:pre-wrap;word-break:break-word;color:var(--on-surface)}
details.thought-card{background:#f8fafc;border:1px dashed #93c5fd;border-radius:8px;padding:6px 10px;margin:4px 0 8px;border-top:1px dashed #93c5fd}
details.thought-card summary{min-height:24px;font-size:12px;font-weight:500;color:#0284c7;cursor:pointer;list-style:none}
details.thought-card summary::-webkit-details-marker{display:none}
details.thought-card pre{font-size:12px;line-height:18px;color:#475569;background:transparent;white-space:pre-wrap;word-break:break-word;margin:4px 0 0}
.generating-card{display:flex;align-items:center;gap:10px;background:#f0f9ff;border:1px dashed #38bdf8;border-radius:12px;padding:12px 16px;margin:8px 0;color:#0284c7;font-size:13px;font-weight:500;animation:pulse 1.8s infinite}
@keyframes pulse{0%,100%{opacity:0.65}50%{opacity:1}}
.agent-dock{position:fixed;bottom:58px;left:0;right:0;background:rgba(255,255,255,0.95);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);border-top:1px solid var(--outline-variant);padding:8px 12px;z-index:5}
.agent-dock-inner{max-width:720px;margin:0 auto;display:flex;flex-direction:column;gap:6px}
.agent-dock-chips{display:flex;gap:6px;overflow-x:auto;padding-bottom:2px}
.agent-dock-chips::-webkit-scrollbar{display:none}
.chip{background:var(--surface-high);color:var(--on-surface-variant);font-size:11px;font-weight:500;padding:4px 10px;border-radius:12px;white-space:nowrap;border:1px solid var(--outline-variant);cursor:pointer}
.chip:active,.chip.active{background:var(--secondary-container);color:var(--on-secondary-container);border-color:var(--primary)}
.agent-input-row{display:flex;gap:8px;align-items:flex-end}
.chat-identity-row{display:flex;align-items:center;gap:8px;padding:0 4px 5px}
.chat-identity-row .agent-select{flex:0 0 116px;min-height:36px;font-size:12px}
.chat-identity-row .muted{flex:1;font-size:11px;line-height:15px}
.chat-identity-row select:focus{outline:none;border-color:var(--primary)}
.agent-dock.model-mode{border-top-color:#a7f3d0;background:rgba(240,253,244,.97)}
.agent-dock.model-mode .agent-input-row button{background:#059669}
.task-tabs{flex-wrap:nowrap!important;overflow-x:auto;padding-bottom:4px}
.task-tabs::-webkit-scrollbar{display:none}
.agent-input-row textarea{flex:1;min-height:42px;max-height:120px;padding:10px 14px;border-radius:20px;border:1px solid var(--outline);background:var(--surface-high);resize:none;font-size:14px;line-height:20px;color:var(--on-surface)}
.agent-input-row button{flex:0 0 68px;min-height:42px;border-radius:20px;padding:0 10px;font-size:13px;font-weight:600;display:flex;align-items:center;justify-content:center}
.modal-overlay{position:fixed;top:0;left:0;width:100vw;height:100vh;background:rgba(15,23,42,0.45);z-index:1000;display:flex;align-items:flex-start;justify-content:center;overflow-y:auto;padding:calc(24px + env(safe-area-inset-top)) 12px 24px;-webkit-overflow-scrolling:touch}
.modal-sheet{background:#fff;width:100%;max-width:720px;margin:0 auto;border-radius:16px;padding:20px 20px 26px;max-height:calc(100vh - 48px);overflow-y:auto;box-sizing:border-box;border:1px solid #dbeafe;box-shadow:0 20px 48px rgba(15,23,42,.22);-webkit-overflow-scrolling:touch}
@keyframes slideUp{from{transform:translateY(100%)}to{transform:translateY(0)}}
</style>

<body>
<header><h1 id="title">OpenQQDots</h1><button id="reload">刷新</button></header>
<main id="main"></main>
<nav class="tabs" id="tabs" hidden></nav>
<div id="toast"></div>
<script>
'use strict';
// 2026-10-12 user: the phone has every page of the desktop panel (PAGES, its order and names); the bottom bar keeps
// The four tabs used most, and All lists them all
const TABS = [['status', '状态'], ['agent', '控制台'], ['chat', '聊天'], ['memory', '记忆'], ['more', '全部']];
const PAGES = [['agent', '智能体控制台'], ['collab', '智能体协作'], ['study', '公共学习资料'], ['workflows', '可学习工作流'], ['status', '小屋状态'], ['basic', '好友资料'], ['memory', '长期记忆'], ['style', '回复方式'], ['voice', '语音回复'], ['proactive', '主动任务与关怀'],
               ['topics', '话题资料'], ['stickers', '表情收藏'], ['template', '人格模板'], ['model', '模型设置'], ['background', '后台整理与反思'],
               ['chat', '聊天记录'], ['emotion', '情绪记录'], ['context', '本轮输入上下文']];
let token = '', friendQQ = '', view = {name: 'home'}, timer = null, chatLimit = 100, emotionLimit = 100;
let chatSenderIdentity = 'friend';

function readToken() {
  const hash = new URLSearchParams(location.hash.slice(1));
  friendQQ = new URLSearchParams(location.search).get('qq') || '';
  token = '';
  if (!/^\d{5,12}$/.test(friendQQ)) return;
  const key = 'houseToken:' + friendQQ;
  if (hash.get('t')) {
    token = hash.get('t');
    try { localStorage.setItem(key, token); } catch (e) {}
    history.replaceState(null, '', location.pathname + location.search);
  } else {
    try { token = localStorage.getItem(key) || ''; } catch (e) {}
  }
}

async function api(path, body) {
  const response = await fetch('/api/' + path, {
    method: body === undefined ? 'GET' : 'POST',
    headers: {'Authorization': 'Bearer ' + token, 'Content-Type': 'application/json'},
    body: body === undefined ? undefined : JSON.stringify(body)});
  const data = await response.json().catch(() => ({error: '电脑未响应'}));
  if (!response.ok) {const error = new Error(data.error || '请求失败'); error.status = response.status; throw error;}
  return data;
}

function el(tag, attrs, ...children) {
  const node = document.createElement(tag);
  for (const [key, value] of Object.entries(attrs || {})) {
    if (key === 'onclick' || key === 'onchange') node[key] = value;
    else if (key === 'class') node.className = value;
    else node.setAttribute(key, value);
  }
  for (const child of children) if (child != null) node.append(child instanceof Node ? child : String(child));
  return node;
}

function toast(text) {
  const box = document.getElementById('toast');
  box.textContent = text;
  box.style.display = 'block';
  clearTimeout(box.timer);
  box.timer = setTimeout(() => box.style.display = 'none', 3000);
}

async function act(button, work) {
  button.disabled = true;
  try { const result = await work(); if (result && result.message) toast(result.message); }
  catch (error) { toast(error.message); }
  finally { button.disabled = false; }
}

function card(title, ...children) { return el('div', {class: 'card'}, title ? el('h2', {}, title) : null, ...children); }
function stateClass(state) { return state === 'running' ? 'ok' : ['attention', 'needs attention'].includes(state) ? 'bad' : 'muted'; }
function stateLabel(state) { return ({running:'运行中', paused:'已暂停', attention:'需要处理', 'needs attention':'需要处理'})[state] || state; }
const TASK_STATES = {PENDING:'待执行', PLANNING:'规划中', RUNNING:'执行中', VERIFYING:'验收中',
  WAITING_APPROVAL:'待授权', WAITING_REVIEW:'待验收', WAITING_RESOURCE:'等待资源', BLOCKED_BY_DEPENDENCY:'等待前置任务',
  PAUSED:'已暂停', BLOCKED:'受阻', FAILED:'失败', COMPLETED:'已完成', CANCELLED:'已取消'};
const EFFORT_LABELS = {off:'关闭', none:'不思考', minimal:'极低', low:'低', medium:'中', high:'高',
  xhigh:'极高', extra:'极高', max:'最高', ultracode:'极高（代码）', ultra:'极高'};

// 2026-10-11 user: the phone app paired with this computer; the model may ask it (front app, usage, screen text).
function phoneCard(qq, phone) {
  const info = phone || {};
  const body = [el('div', {class: 'muted'}, info.note || '')];
  if (info.mcp_url) body.push(el('div', {class: 'muted'}, '手机地址：' + info.mcp_url));
  const pairing = `friendhouse://pair?pc=${encodeURIComponent(location.origin + '/')}&qq=${qq}&t=${encodeURIComponent(token)}`;
  body.push(el('a', {href: pairing}, '连接手机应用'));
  body.push(el('div', {class: 'muted'}, '仅配对当前好友，其他好友需分别扫码。'));
  return card('手机应用 · ' + (!info.connected ? '未配对' : info.online ? '在线' : '已配对（离线）'), ...body);
}

// 2026-10-11 user: the phone edits the same settings as the desktop panel; its rules live in house_status
function options(list, value) {
  return list.map(item => el('option', Object.assign({value: item.id}, String(item.id) === String(value) ? {selected: 'selected'} : {}), item.name));
}

function field(label, node) {
  if (['INPUT', 'SELECT', 'TEXTAREA'].includes(node.tagName)) node.setAttribute('aria-label', label);
  return el('label', {class: 'field'}, el('span', {}, label), node);
}
function input(attrs) { return el('input', Object.assign({type: 'text'}, attrs || {})); }
function area(attrs) { return el('textarea', Object.assign({class: 'small'}, attrs || {})); }

function form(fields, button, work) {
  const save = el('button', {class: 'primary'}, button);
  save.onclick = () => act(save, () => work());
  return el('div', {}, ...fields, el('div', {class: 'row'}, el('span', {class: 'grow'}), save));
}

function numberText(value) { return value === '' || value === null || value === undefined ? '' : String(value); }

function show(...nodes) {
  const main = document.getElementById('main');
  main.replaceChildren(...nodes);
}

async function openHouse() {
  view = {name: 'home'};
  document.getElementById('tabs').hidden = true;
  show(card('', el('div', {class: 'muted'}, '正在打开好友小屋…')));
  const data = await api('session');
  if (data.qq !== friendQQ) throw new Error('二维码与好友不匹配，请在电脑上重新扫码。');
  openFriend(data.qq, data.name, 'status');
}

function openFriend(qq, name, tab) {
  view = {name: 'friend', qq, friendName: name, tab};
  document.getElementById('title').textContent = name;
  document.title = name;  // the phone app shows it in its own top bar
  const tabs = document.getElementById('tabs');
  tabs.hidden = false;
  const inBar = TABS.some(([key]) => key === tab);
  tabs.replaceChildren(...TABS.map(([key, label]) => {
    const button = el('button', {class: key === tab || (key === 'more' && !inBar) ? 'on' : ''}, el('span', {}, label));
    button.onclick = () => { chatLimit = 100; emotionLimit = 100; openFriend(qq, name, key); };
    return button;
  }));
  window.scrollTo(0, 0);
  render().catch(error => toast(error.message));
}

async function render() {
  document.body.classList.remove('chat-page');
  const mainNode = document.querySelector('main');
  if (mainNode) mainNode.style.paddingBottom = '';
  if (view.name === 'home') return openHouse();
  return PAGE_VIEWS[view.tab](view.qq);
}

// All: every desktop page in order
function morePage(qq) {
  const items = PAGES.map(([key, label]) => {
    const item = el('button', {}, el('span', {}, label), el('span', {class: 'muted'}, '›'));
    item.onclick = () => openFriend(qq, view.friendName, key);
    return item;
  });
  show(card('全部页面', el('div', {class: 'muted'}, '与桌面端对应的管理入口。'), el('div', {class: 'list'}, ...items)));
}

async function statusPage(qq) {
  const data = await api('friend/' + qq);
  const toggle = el('button', {}, data.paused ? '启用好友' : '暂停好友');
  toggle.onclick = () => act(toggle, async () => { const r = await api(`friend/${qq}/toggle`, {}); await render(); return r; });
  const switches = data.switches.map(item => {
    const box = el('input', {type: 'checkbox'});
    box.checked = item.on;
    box.onchange = () => act(box, async () => {
      try { return await api(`friend/${qq}/switch`, {key: item.key, on: box.checked}); }
      catch (error) { box.checked = !box.checked; throw error; }
    });
    return el('label', {class: 'switch'}, el('div', {class: 'grow'}, el('div', {}, item.title), el('div', {class: 'muted'}, item.note)), box);
  });
  const problems = data.rows.map(item => {
    const retry = el('button', {}, '重试');
    retry.disabled = item.state !== 'failed';
    retry.onclick = () => act(retry, async () => { const r = await api(`friend/${qq}/retry`, {message_id: item.message_id}); await render(); return r; });
    return el('div', {class: 'problem'}, el('div', {class: 'row'},
      el('span', {class: 'grow muted'}, item.created_at.slice(5, 16).replace('T', ' ')), retry),

// 2026-10-26 user: see directly which agents are working and what they handed each other (collaboration_view.py)
const COLLAB_STATUS = {working: ['工作中', 'ok'], waiting: ['待处理', 'bad'], idle: ['空闲', 'muted']};
const PROVIDER_COLORS = {codex: '#0F9D78', claude: '#D97757', antigravity: '#4285F4', orchestrator: '#64748B', api: '#8B5CF6',
  dsh: '#1D4ED8', deepseek: '#1D4ED8', local: '#0EA5E9', mcp: '#A855F7'};
const KIND_COLORS = {handoff: '#2563EB', response: '#16A34A', finding: '#D97706', request: '#7C3AED', review: '#0D9488', note: '#94A3B8'};
function clockText(seconds) {
  const moment = new Date(seconds * 1000), today = new Date().toDateString() === moment.toDateString();
  return moment.toLocaleString('zh-CN', today ? {hour: '2-digit', minute: '2-digit', second: '2-digit'}
    : {month: '2-digit', day: '2-digit', hour: '2-digit', minute: '2-digit'});
}

// The node's state in at most five characters (collaboration_view.tree's brief), coloured like the desktop.
const BRIEF_GOOD = ['交回', '通过', '完成', '已复', '汇总'], BRIEF_BAD = ['失败', '未过', '取消', '受阻'];
const BRIEF_BUSY = ['处理', '等待', '待复', '已派', '进行', '待验', '待批', '等资', '待办', '暂停'];
function briefColor(text) {
  if (text.includes('/')) { const [done, total] = text.split('/'); return done === total ? '#15803D' : '#B45309'; }
  return BRIEF_GOOD.includes(text) ? '#15803D' : BRIEF_BAD.includes(text) ? '#B91C1C' : BRIEF_BUSY.includes(text) ? '#B45309' : '#64748B';
}

function nodeColor(node, providers) {
  if (node.type === 'task') return '#2563EB';
  const name = (node.agent_id || '').split('/').pop();
  return PROVIDER_COLORS[node.provider] || PROVIDER_COLORS[name === 'supervisor' ? 'orchestrator' : name]
    || PROVIDER_COLORS[providers[node.agent_id]] || '#475569';
}

// One collaboration as a vertical node tree (2026-10-26 user, after a reference picture): a round node per row, a
// bold title, and under it the step's state in at most five characters; tapping a message node opens it.
function collabTree(node, thread, providers) {
  const color = nodeColor(node, providers), brief = node.brief || '';
  const title = node.type === 'message'  // four or five characters wide: the step's tag, then who did it
    ? [el('span', {style: `color:${KIND_COLORS[node.kind] || 'inherit'}`}, node.tag), node.short]
    : [el('span', {style: node.type === 'task' ? `color:${color}` : ''}, node.short)];
  const box = el('div', {class: 'tnode' + (node.type !== 'message' ? ' big' : '') + (node.children.length ? ' kids' : '')},
    el('span', {class: 'tdot', style: `border-color:${color};background:${color}`}),
    el('div', {class: 'ttl'}, ...title),
    el('div', {class: 'sub'}, el('span', {style: `color:${briefColor(brief)}`}, brief)));
  if (node.type === 'message') {
    const message = thread.messages[node.index];
    const body = el('pre', {class: 'muted', style: 'display:none;margin-top:6px;white-space:pre-wrap'},
      `${node.kind_label || ''} · ${node.label}${node.at ? '　' + clockText(node.at) : ''}
${node.detail || ''}
${message.from_label} → ${message.to.map(item => item.label + '（' + item.state_label + '）').join('、') || '—'}

${message.excerpt}`);
    box.append(body);
    box.style.cursor = 'pointer';
    box.onclick = () => {
      const open = body.style.display === 'none';
      body.style.display = open ? 'block' : 'none';
      box.classList.toggle('open', open);
    };
  }
  const kids = node.children.length ? el('div', {class: 'tkids'}, ...node.children.map(child => collabTree(child, thread, providers))) : null;
  return el('div', {class: 'titem'}, box, kids);
}

let roomLoad = 0;
async function collaborationRoomsCard(qq) {
  const generation = ++roomLoad;
  const alive = () => generation === roomLoad && view.qq === qq && view.tab === 'collab';

  const selector = el('select', {'aria-label':'协作房间'}, ...options(data.rooms.map(room => ({id:room.id, name:room.title})), data.rooms[0]?.id));
  async function readRoom() {
    const id = selector.value;
    if (!id) {detail.replaceChildren(el('p', {class:'muted'}, '新建房间后添加智能体，再选择主智能体分工。')); return;}
    const value = await api(`friend/${qq}/collaboration_rooms?room_id=${encodeURIComponent(id)}`);

    const name = input({maxlength:'32', placeholder:'成员名称'}), role = input({maxlength:'180', placeholder:'具体分工'});
    const change = async body => {await send({room_id:id, ...body}); if(alive()) await readRoom();};
    const host = el('select', {'aria-label':'主智能体'}, ...options([{id:'', name:'选择主智能体'}, ...room.members.map(member => ({id:member.id, name:member.name}))], room.host_id));
    const members = room.members.map(member => el('div', {class:'switch'}, el('div', {class:'grow'},
      el('div', {}, member.name), el('div', {class:'muted'}, member.role)), button('移除', () => change({action:'remove', member_id:member.id}))));
    const output = el('pre', {'aria-label':'协作执行结果'});
    function result(latest) {
      const task = latest.task;
      const assignments = latest.routing.members || [];
      output.textContent = (task ? '任务状态：' + (TASK_STATES[task.status] || task.status) + '\n' : '') +
        assignments.map(member => `${member.name} · ${member.model || '配置模型'} · ${EFFORT_LABELS[member.effort] || member.effort || '工具管理'}：${member.assignment || ''}`).join('\n') +
        '\n' + (latest.room.messages || []).slice(-12).map(message => `${message.name || '用户'}：${message.content}`).join('\n\n') +
        (task?.error ? '\n执行未完成：' + task.error : '');
      return task && ['PENDING','RUNNING','PLANNING','VERIFYING'].includes(task.status);
    }
    const poll = async () => {
      if (!alive() || selector.value !== id || !output.isConnected) return;
      try {const latest = await api(`friend/${qq}/collaboration_rooms?room_id=${encodeURIComponent(id)}`);
        if (alive() && selector.value === id && output.isConnected && result(latest)) setTimeout(poll, 4000);
      } catch(error) {if(alive()) toast(error.message);}
    };
    const text = area({'aria-label':'协作任务', maxlength:'4000', placeholder:'明确任务、产物和验收要求'});
    const pendingKey = `qqdot-collab-request:${qq}:${id}`;
    let pending = null;
    try {const saved = JSON.parse(sessionStorage.getItem(pendingKey));
      if(saved && typeof saved.text === 'string' && /^[a-f0-9]{32}$/.test(saved.request_id)) {pending=saved; text.value=saved.text;}
    } catch(error) { /* No stored request. */ }
    const run = button('交给主智能体分工', async () => {
      if (!room.host_id) throw new Error('请先选择并保存主智能体');
      if (!text.value.trim()) throw new Error('请先填写协作任务');
      if (pending && pending.text !== text.value) throw new Error('上一请求结果未确认，请先刷新核对，避免重复执行');
      if (!pending) pending = {text:text.value, request_id:Array.from(crypto.getRandomValues(new Uint8Array(16)), v=>v.toString(16).padStart(2,'0')).join('')};
      sessionStorage.setItem(pendingKey, JSON.stringify(pending));
      try {await send({action:'run', room_id:id, ...pending});}
      catch(error) {if(error.status >= 400 && error.status < 500) {pending=null; sessionStorage.removeItem(pendingKey);} throw error;}
      pending = null;
      sessionStorage.removeItem(pendingKey);
      if (alive()) {text.value=''; await poll();}
      return {message:'任务已提交，请查看实际执行与验收结果。'};
    });
    detail.replaceChildren(...members, field('主智能体', host), button('保存主智能体', () => change({action:'set_host', member_id:host.value})),

      button('添加智能体', () => change({action:'add', provider:provider.value, name:name.value, role:role.value})),
      field('协作任务', text), run, output);
    if(result(value)) setTimeout(poll, 4000);
  }
  selector.onchange = () => readRoom().catch(error => toast(error.message));
  await readRoom();
  return card('主智能体与协作房间', el('div', {class:'muted'}, '当前好友独立管理。主智能体从已配置的模型和思考强度中选择，分工及真实返回结果显示在下方。'),

let backgroundLoad = 0;
async function backgroundPage(qq) {
  const generation = ++backgroundLoad;
  const data = await api(`friend/${qq}/background_settings`);
  if (generation !== backgroundLoad || view.qq !== qq || view.tab !== 'background') return;
  let revision = data.revision;
  const rows = data.catalog;
  const route = data.background_model || {};
  const provider = el('select', {}, ...options([{id:'', name:'沿用当前聊天模型'},
    ...rows.map(item => ({id:item.provider, name:item.name}))], route.provider || ''));
  const model = el('select', {}), effort = el('select', {});
  function changeEffort(preferred) {
    const entry = rows.find(item => item.provider === provider.value);
    const levels = (entry?.models.find(item => item.id === model.value)?.efforts) || [];
    const chosen = levels.includes(preferred) ? preferred : levels.includes(entry?.default_effort) ? entry.default_effort : levels[0];
    effort.replaceChildren(...options((levels.length ? levels : ['']).map(id => ({id, name:EFFORT_LABELS[id] || id || '由工具管理'})), chosen || ''));
    effort.disabled = !levels.length;
  }
  function changeProvider(preferredModel, preferredEffort) {
    const entry = rows.find(item => item.provider === provider.value);
    const models = entry?.models || [];
    const chosen = models.some(item => item.id === preferredModel) ? preferredModel : entry?.default_model || '';
    model.replaceChildren(...options(models.length ? models.map(item => ({id:item.id, name:item.id || '沿用工具配置'})) : [{id:'', name:'沿用当前聊天模型'}], chosen));
    model.disabled = !entry;
    changeEffort(preferredEffort);
  }
  provider.onchange = () => changeProvider();
  model.onchange = () => changeEffort();
  changeProvider(route.model, route.effort);
  const quota = area({'aria-label':'模型额度用完时的QQ回复', maxlength:'1200'});
  quota.value = data.quota_reply;
  const save = el('button', {class:'primary'}, '保存当前好友设置');
  save.onclick = () => act(save, async () => {
    if (view.qq !== qq || view.tab !== 'background' || generation !== backgroundLoad) throw new Error('页面已切换，请重新读取当前好友设置');
    const result = await api(`friend/${qq}/background_settings`, {revision,
      background_model: provider.value ? {provider:provider.value, model:model.value, effort:effort.value} : {}, quota_reply:quota.value});
    revision = result.revision;
    return result;
  });
  show(card('后台整理与自动反思', el('div', {class:'muted'}, '当前好友独立配置；用于记忆整理和任务失败反思。反思建议需经实际验收，才能形成已验证经验。'),
    field('模型来源', provider), field('模型', model), field('思考强度', effort),
    el('div', {class:'muted'}, '候选来自电脑已保存配置和缓存；反思只使用可关闭工具的纯文本通道。')),
    card('模型额度用完时的 QQ 回复', el('div', {class:'muted'}, '最多1200字，按原文发给当前好友；留空则不额外回复。'), quota,
      el('div', {class:'row'}, save, button('重新读取', () => backgroundPage(qq)))));
}

// Current input: what the model received, slot by slot in fixed order
const PLACES = {'header': '开头说明', 'rules': '1 规则', 'persona': '2 人设与风格', 'interlocutor': '3 好友资料', 'recent': '4 最近上下文',
                'knowledge': '5 检索资料', 'examples': '6 回复示例', 'chat': '7 摘要与对话', 'notes': '8 作者备注', 'task': '9 当前任务'};

function inputCards(title, data) {
  const blocks = data.blocks.map(item => el('details', {},
    el('summary', {}, el('span', {class: 'grow'}, `${PLACES[item.slot] || item.slot} · ${item.title}`), el('span', {class: 'muted'}, `${item.chars} 字符`)),
    el('div', {class: 'muted'}, `来源：${item.source || '—'} · ${item.kind}`), el('pre', {}, item.text)));
  const present = new Set(data.blocks.map(item => item.slot));
  const absent = Object.keys(PLACES).filter(slot => slot !== 'header' && !present.has(slot)).map(slot => PLACES[slot]);
  const sent = el('details', {}, el('summary', {}, el('span', {class: 'grow'}, '实际发送内容'), el('span', {class: 'muted'}, `${data.sent_chars} 字符`)),
                  el('pre', {}, data.sent));
  return card(title, el('div', {class: 'muted'}, data.chars ? `完整提示：${data.chars} 字符 · 实际发送：${data.sent_chars} 字符` : '暂无生成记录。'),
              data.chars && absent.length ? el('div', {class: 'muted'}, '本轮未包含：' + absent.join(', ')) : null,
              data.conflicts.length ? el('div', {class: 'bad'}, '指令冲突：' + data.conflicts.join('; ')) : null,
              ...blocks, data.chars ? sent : null);
}

function retrievalText(searches) {
  const lines = [];
  for (const search of searches) {
    if (search.tool) lines.push(`[${search.label}] 查询：${search.query} (${search.status || '状态未知'})`);
    else lines.push(`[${search.label || '检索'}] 查询：${search.query} 候选数：${search.pool}`
      + (search.reranked ? '，已重排' : '，未重排') + `，丢弃：${search.dropped}`);
    for (const [text, score] of search.hits) lines.push(`  ${score == null ? '—' : score.toFixed(3)}  ${text}`);
  }
  return lines.join('\n') || '本轮未执行向量或关键词检索。';
}

function agentViewMatches(qq) {

async function agentPage(qq) {
  const epoch = ++agentPageEpoch;
  const [wsData, cfgData] = await Promise.all([
    api(`friend/${qq}/agent_workspaces`),
    api(`friend/${qq}/agent_config`)
  ]);
  if (epoch !== agentPageEpoch || !agentViewMatches(qq)) return;
  const workspace = wsData.active_id || 'default';
  const sessData = await api(`friend/${qq}/agent_sessions?ws_id=${encodeURIComponent(workspace)}`);
  if (epoch !== agentPageEpoch || !agentViewMatches(qq)) return;
  agentConfigData = cfgData;
  currentAgentWs = workspace;
  if (!sessData.sessions || sessData.sessions.length === 0) {
    currentAgentSid = 'session_main';
  } else if (!sessData.sessions.some(s => s.id === currentAgentSid) && currentAgentSid !== '__qq_stream__') {
    currentAgentSid = sessData.active_id || sessData.sessions[0].id;
  }

  await renderAgentConsole(qq, wsData, sessData);
}

    const newSess = await api(`friend/${qq}/agent_sessions?ws_id=${encodeURIComponent(currentAgentWs)}`);
    currentAgentSid = res.session ? res.session.id : (newSess.sessions[0] ? newSess.sessions[0].id : 'session_main');

      } else {
        const header = el('div', {class: 'agent-msg-header'},
          el('span', {style: 'font-weight: 600; color: var(--primary);'}, (sessionData.is_qq ? '' : 'AI · ') + (m.agent_name || (sessionData.is_qq ? '好友' : '智能体'))),
          el('span', {}, (m.timestamp ? m.timestamp.slice(11, 16) : ''))
        );
        const children = [header];
        if (m.thinking) {
          const summary = el('summary', {}, `思考过程（${m.thinking.length} 字符）· 点击展开`);
          const pre = el('pre', {}, m.thinking);
          children.push(el('details', {class: 'thought-card'}, summary, pre));
        }
        children.push(el('div', {class: 'agent-msg-body'}, m.content));
        msgList.append(el('div', {class: 'agent-msg-assistant'}, ...children));
      }
    }
  }
  }
  paintMessages(sessionData.messages);

  // Generating card placeholder
  const generatingCard = el('div', {class: 'generating-card', id: 'agent-gen-card', style: isGenerating ? '' : 'display:none;'},
    el('span', {style: 'font-size: 18px;'}, 'AI'),
    el('span', {}, '智能体正在分析上下文、检索记忆并生成回复…')
  );
  msgList.append(generatingCard);

  // 4. Input Dock
  const quickQq = el('div', {class: 'chip' + (currentAgentSid === '__qq_stream__' ? ' active' : '')}, 'QQ 实时消息');
  quickQq.onclick = async () => {
    currentAgentSid = '__qq_stream__';
    await renderAgentConsole(qq, wsData, sessData);
  };
  const quickNew = el('div', {class: 'chip'}, '+ 新建会话');
  quickNew.onclick = newSessBtn.onclick;
  const quickClear = el('div', {class: 'chip'}, '/clear 清空');
  quickClear.onclick = clearBtn.onclick;

  const chipsRow = el('div', {class: 'agent-dock-chips'}, quickQq, quickNew, quickClear);
  const inputMode = el('select', {title: '工作台输入方式'},
    el('option', {value: 'task'}, '执行任务'), el('option', {value: 'chat'}, '直接对话'));
  inputMode.style.display = currentAgentSid === '__qq_stream__' ? 'none' : '';
  chipsRow.appendChild(inputMode);

  const inputBox = el('textarea', {placeholder: currentAgentSid === '__qq_stream__' ? '向好友发送 QQ 消息…' : '输入要执行的任务，或切换到直接对话…'});
  const sendBtn = el('button', {class: 'primary'}, '发送');

  const doSend = async () => {
    const text = inputBox.value.trim();
    if (!text || isGenerating || !wrap.isConnected || !agentViewMatches(qq)) return;
    inputBox.value = '';

    msgList.insertBefore(el('div', {class: 'bubble me'}, text), generatingCard);
    isGenerating = true;
    generatingCard.style.display = 'flex';
    sendBtn.disabled = true;
    window.scrollTo(0, document.body.scrollHeight);

    try {
      const res = await api(`friend/${qq}/agent_send`, {
        ws_id: currentAgentWs,
        sid: currentAgentSid,
        text: text,
        provider: agentConfigData.provider,
        model: agentConfigData.model,
        effort: agentConfigData.effort,
        mode: inputMode.value
      });

      isGenerating = false;
      generatingCard.style.display = 'none';
      if (res.is_qq) {
        await refreshQqMessages();
        return;
      }

      const header = el('div', {class: 'agent-msg-header'},
        el('span', {style: 'font-weight: 600; color: var(--primary);'}, 'AI · ' + (res.agent_name || (res.is_qq ? '我（QQ）' : '智能体'))),
        el('span', {}, '刚刚')
      );
      const children = [header];
      if (res.thinking) {
        const summary = el('summary', {}, `思考过程（${res.thinking.length} 字符）· 点击展开`);
        const pre = el('pre', {}, res.thinking);
        children.push(el('details', {class: 'thought-card'}, summary, pre));
      }
      children.push(el('div', {class: 'agent-msg-body'}, res.reply || ''));
      msgList.insertBefore(el('div', {class: 'agent-msg-assistant'}, ...children), generatingCard);
      window.scrollTo(0, document.body.scrollHeight);
    } catch (err) {
      isGenerating = false;
      generatingCard.style.display = 'none';
      toast('执行失败：' + err.message);
    } finally {
      sendBtn.disabled = false;
    }
  };

  sendBtn.onclick = doSend;
  inputBox.onkeydown = (e) => {
    if (e.key === 'Enter' && !e.shiftKey && !e.isComposing) {
      e.preventDefault();
      doSend();
    }
  };

  const inputRow = el('div', {class: 'agent-input-row'}, inputBox, sendBtn);
  const dockInner = el('div', {class: 'agent-dock-inner'}, chipsRow, inputRow);
  const dock = el('div', {class: 'agent-dock'}, dockInner);

  const wrap = el('div', {class: 'agent-wrap'}, topbar, modelPill, taskBanner, msgList, dock);
  show(wrap);
  let qqSignature = JSON.stringify(sessionData.messages || []), qqPolling = false;
  async function refreshQqMessages() {
    if (!wrap.isConnected || friendQQ !== qq || currentAgentSid !== '__qq_stream__' || qqPolling) return;
    qqPolling = true;
    try {
      const data = await api(`friend/${qq}/agent_session?sid=__qq_stream__`);
      if (!wrap.isConnected || friendQQ !== qq || currentAgentSid !== '__qq_stream__') return;
      const next = JSON.stringify(data.messages || []);
      if (next !== qqSignature) {
        qqSignature = next;
        paintMessages(data.messages);
        msgList.append(generatingCard);
      }
      if (data.sync_warning) topbar.title = data.sync_warning;
    } finally { qqPolling = false; }
  }
  if (sessionData.is_qq) {
    const streamTimer = setInterval(() => {
      if (!wrap.isConnected || friendQQ !== qq || currentAgentSid !== '__qq_stream__') {clearInterval(streamTimer);return;}
      if (!document.hidden && !isGenerating) refreshQqMessages().catch(() => {});
    }, 2500);
  }
}

function openModelSelectorModal(qq, onSave) {
  const modal = el('div', {class: 'modal-overlay'});
  const cfg = agentConfigData;

  const provSelect = el('select', {class: 'agent-select', style: 'width: 100%; min-height: 44px; margin-bottom: 12px; font-weight: 500;'},
    ...(cfg.providers || []).map(p => el('option', Object.assign({value: p.id}, p.id === cfg.provider ? {selected: 'selected'} : {}), p.name))
  );

  const modelSelect = el('select', {class: 'agent-select', style: 'width: 100%; min-height: 44px; margin-bottom: 12px;'});
  const effortSelect = el('select', {class: 'agent-select', style: 'width: 100%; min-height: 44px; margin-bottom: 16px;'});

  const updateModels = (prov) => {
    let list = [];
    if (prov === cfg.provider) {
      list = [...(cfg.main_models || []), ...(cfg.overflow_models || [])];
    } else {
      if (prov === 'claude') {
        list = [{id: 'claude-opus-5-5', name: 'Opus 5.5'}, {id: 'claude-sonnet-5-5', name: 'Sonnet 5.5'}, {id: 'claude-haiku-5-5', name: 'Haiku 5.5'}];
      } else if (prov === 'dsh') {
        list = [{id: 'DeepSeek-V41-Flash', name: 'DeepSeek-V41-Flash'}, {id: 'DeepSeek-V4-Pro', name: 'DeepSeek-V4-Pro'}];
      } else if (prov === 'antigravity') {
        list = [{id: 'gemini-3.8-flash-high', name: 'Gemini 3.8 Flash High'}, {id: 'gemini-3.8-flash-medium', name: 'Gemini 3.8 Flash Medium'}, {id: 'gemini-3.8-flash-low', name: 'Gemini 3.8 Flash Low'}];
      } else if (prov === 'custom') {
        list = [{id: 'deepseek-chat', name: 'DeepSeek V3'}, {id: 'deepseek-reasoner', name: 'DeepSeek R1'}, {id: 'gpt-4o', name: 'GPT-4o'}];
      } else if (['opencode', 'cursor', 'qwen_code', 'kimi_code', 'acp'].includes(prov)) {
        list = [{id: '沿用工具配置', name: '沿用工具配置'}];
      } else {
        list = [{id: 'gpt-6.1-sol', name: 'GPT-6.1 Sol'}, {id: 'gpt-6-astra', name: 'GPT-6 Astra'}, {id: 'gpt-6-luna', name: 'GPT-6 Luna'}];
      }
    }
    modelSelect.replaceChildren(...list.map(m => el('option', Object.assign({value: m.id}, m.id === cfg.model ? {selected: 'selected'} : {}), m.name)));
    updateEfforts(prov, modelSelect.value);
  };

  const updateEfforts = (prov, modelId) => {
    const m = (modelId || '').toLowerCase();
    let efforts = [];
    if (['opencode', 'cursor', 'qwen_code', 'kimi_code', 'acp'].includes(prov)) {
      efforts = [{id: '沿用工具配置', name: '沿用工具配置'}];
    } else if (prov === 'antigravity' || m.includes('gemini')) {
      efforts = [{id: 'off', name: '关闭'}, {id: 'low', name: '低'}, {id: 'medium', name: '中'}, {id: 'high', name: '高'}];
    } else if (prov === 'dsh' || m.includes('deepseek')) {
      if (m.includes('flash') || m.includes('v41')) {
        efforts = [{id: 'off', name: '关闭'}, {id: 'low', name: '低'}, {id: 'medium', name: '中'}, {id: 'high', name: '高'}];
      } else {
        efforts = [{id: 'off', name: '关闭'}, {id: 'low', name: '低'}, {id: 'medium', name: '中'}, {id: 'high', name: '高'}, {id: 'max', name: '最高（深入）'}];
      }
    } else if (prov === 'claude') {
      efforts = [{id: 'off', name: '关闭'}, {id: 'low', name: '低'}, {id: 'medium', name: '中'}, {id: 'high', name: '高'}, {id: 'max', name: '最高'}];
    } else {
      efforts = [{id: 'none', name: '不思考（关闭）'}, {id: 'low', name: '低'}, {id: 'medium', name: '中'}, {id: 'high', name: '高'}, {id: 'max', name: '最高'}, {id: 'ultra', name: '极高'}];
    }
    effortSelect.replaceChildren(...efforts.map(e => el('option', Object.assign({value: e.id}, e.id === cfg.effort ? {selected: 'selected'} : {}), e.name)));
  };

  provSelect.onchange = () => updateModels(provSelect.value);
  modelSelect.onchange = () => updateEfforts(provSelect.value, modelSelect.value);
  updateModels(provSelect.value);

  const saveBtn = el('button', {class: 'primary', style: 'flex: 1;'}, '保存并切换');
  saveBtn.onclick = async () => {
    saveBtn.disabled = true;
    try {
      await api(`friend/${qq}/agent_config`, {
        provider: provSelect.value,
        model: modelSelect.value,
        effort: effortSelect.value
      });
      toast('智能体模型与思考强度已更新');
      if (onSave) await onSave(); else await render();
    } catch (err) {
      toast('保存失败：' + err.message);
    } finally {
      saveBtn.disabled = false;
    }
  };

  const cancelBtn = el('button', {style: 'flex: 1;'}, '返回');
  cancelBtn.onclick = () => render();

  show(card('智能体模型与思考设置',
    el('div', {class: 'muted', style: 'margin-bottom: 6px;'}, '这里的修改与电脑端控制台共用同一份好友配置，保存后桌面端下次读取会同步。'),
    el('div', {class: 'muted', style: 'margin-bottom: 6px;'}, '智能体来源'),
    provSelect,
    el('div', {class: 'muted', style: 'margin-bottom: 6px;'}, '模型标识'),
    modelSelect,
    el('div', {class: 'muted', style: 'margin-bottom: 6px;'}, '思考强度'),
    effortSelect,
    el('div', {class: 'row', style: 'gap: 12px; margin-top: 14px;'}, cancelBtn, saveBtn)
  ));
}

async function openTaskDashboardModal(qq) {
  const modal = el('div', {class: 'modal-overlay'});
  let currentTab = 'tasks'; // 'tasks', 'approvals', 'new'

  const contentBox = el('div', {style: 'margin-top: 12px;'});

  const renderContent = async () => {
    contentBox.replaceChildren(el('div', {style: 'text-align:center; padding: 20px; color: var(--on-surface-variant);'}, '正在加载…'));
    try {
      if (currentTab === 'tasks') {
        const res = await api(`friend/${qq}/agent_tasks`);
        const tasks = res.tasks || [];
        contentBox.replaceChildren();

        if (tasks.length === 0) {
          contentBox.append(el('div', {class: 'card', style: 'text-align:center; padding:24px; color:var(--on-surface-variant);'}, '暂无进行中的任务'));
          return;
        }

        for (const t of tasks) {
          const statusColors = {
            RUNNING: '#10b981', PENDING: '#6366f1', COMPLETED: '#059669',
            WAITING_APPROVAL: '#f59e0b', WAITING_RESOURCE: '#d97706',
            PAUSED: '#6b7280', FAILED: '#ef4444', CANCELLED: '#9ca3af'
          };
          const badgeColor = statusColors[t.status] || '#6366f1';

          const cardHeader = el('div', {style: 'display:flex; justify-content:space-between; align-items:center;'},
            el('span', {style: 'font-weight:600; font-size:14px; color:var(--on-surface);'}, t.title),
            el('span', {style: `background: ${badgeColor}20; color: ${badgeColor}; padding: 2px 8px; border-radius: 6px; font-size:11px; font-weight:600;`}, TASK_STATES[t.status] || t.status)
          );

          const desc = el('div', {class: 'muted', style: 'font-size:12px; margin: 4px 0 8px; max-height: 40px; overflow:hidden; text-overflow:ellipsis;'}, t.description);

          const actions = el('div', {style: 'display:flex; gap: 8px; justify-content:flex-end; margin-top:8px;'});

          if (t.status === 'RUNNING' || t.status === 'PENDING') {
            actions.append(el('button', {class: 'agent-icon-btn', onclick: async () => {
              await api(`friend/${qq}/agent_task_action`, {action: 'pause', task_id: t.task_id});
              toast('已暂停');
              renderContent();
            }}, '暂停'));
            actions.append(el('button', {class: 'agent-icon-btn', style: 'color:#dc2626;', onclick: async () => {
              await api(`friend/${qq}/agent_task_action`, {action: 'cancel', task_id: t.task_id});
              toast('已取消');
              renderContent();
            }}, '取消'));
          } else if (t.status === 'PAUSED' || t.status === 'WAITING_RESOURCE' || t.status === 'FAILED') {
            actions.append(el('button', {class: 'agent-icon-btn', style: 'color:var(--primary);', onclick: async () => {
              await api(`friend/${qq}/agent_task_action`, {action: 'resume', task_id: t.task_id});
              toast('已继续');
              renderContent();
            }}, '继续执行'));
          } else if (t.status === 'WAITING_APPROVAL') {
            actions.append(el('button', {class: 'primary', style: 'min-height:30px; font-size:12px;', onclick: async () => {
              if (t.category === 'goal_plan') {
                if (!confirm('按现有授权范围和预算执行以下阶段计划？\n' + t.result)) return;
                await api(`friend/${qq}/agent_goal_action`, {action: 'accept_plan', task_id: t.task_id});
                toast('目标已创建');
              } else {
                await api(`friend/${qq}/agent_task_action`, {action: 'approve', task_id: t.task_id});
                toast('已确认验收');
              }
              renderContent();
            }}, t.category === 'goal_plan' ? '确认计划并创建目标' : '确认验收通过'));
          }

          const detailsBtn = el('button', {class: 'agent-icon-btn', style: 'color:var(--on-surface-variant);'}, '查看日志');
          const logContainer = el('div', {style: 'display:none; margin-top:8px; padding-top:8px; border-top:1px dashed var(--outline-variant); font-size:11px; font-family:monospace; max-height:160px; overflow-y:auto;'});

          detailsBtn.onclick = async () => {
            if (logContainer.style.display === 'none') {
              logContainer.style.display = 'block';
              detailsBtn.textContent = '收起日志';
              logContainer.textContent = '正在读取日志…';
              const detail = await api(`friend/${qq}/agent_task_detail?task_id=${encodeURIComponent(t.task_id)}`);
              logContainer.replaceChildren();
              for (const l of (detail.logs || [])) {
                logContainer.append(el('div', {style: 'margin-bottom:3px;'},
                  el('span', {class: 'muted'}, `[${l.created_at.slice(11,19)}] [${l.step_name}] `),
                  el('span', {}, l.message)
                ));
              }
            } else {
              logContainer.style.display = 'none';
              detailsBtn.textContent = '查看日志';
            }
          };
          actions.prepend(detailsBtn);

          const taskCard = el('div', {class: 'card', style: 'padding: 12px; margin-bottom: 10px; border-radius: 12px;'},
            cardHeader, desc, ...(t.category === 'goal_plan' ? [el('pre', {style:'white-space:pre-wrap; max-height:240px; overflow:auto;'}, t.result || '规划完成后在此显示阶段草案')] : []), actions, logContainer
          );
          contentBox.append(taskCard);
        }

      } else if (currentTab === 'goals') {
        const res = await api(`friend/${qq}/agent_goals`);
        contentBox.replaceChildren();
        const labels = {ACTIVE:'执行中', PAUSED:'已暂停', BLOCKED:'受阻',
          WAITING_REVIEW:'待确认', COMPLETED:'已完成', CANCELLED:'已取消'};
        if (!(res.goals || []).length) contentBox.append(el('div', {class:'card'}, '暂无长期目标，可在新建目标中创建。'));
        for (const g of (res.goals || [])) {
          const actions = el('div', {class:'row', style:'gap:8px; flex-wrap:wrap; margin-top:10px;'});
          const control = (action, text) => el('button', {onclick:async () => {
            try {
              const review = action === 'complete' ? prompt('请按验收标准填写评估结果：' + g.completion_criteria) : '';
              if (action === 'complete' && !review) return;
              if (action === 'cancel' && !confirm('终止此目标及其未完成的阶段？')) return;
              const result = await api(`friend/${qq}/agent_goal_action`, {action, goal_id:g.goal_id, review});
              toast(result.message); await renderContent();
            } catch (err) { toast(err.message); }
          }}, text);
          if (g.status === 'ACTIVE') actions.append(control('pause','暂停'));
          if (g.status === 'PAUSED' || g.status === 'BLOCKED') actions.append(control('resume','继续目标'));
          if (g.status === 'WAITING_REVIEW') actions.append(control('complete','确认最终验收'));
          if (!['COMPLETED','CANCELLED'].includes(g.status)) actions.append(control('cancel','终止'));
          const details = el('details', {}, el('summary', {}, '阶段、产物与历史'));
          for (const t of g.tasks) details.append(el('div', {class:'muted', style:'margin-top:8px; white-space:pre-wrap;'},
            `${t.title} · ${TASK_STATES[t.status] || t.status}\n${t.error || t.result || '等待执行'}${t.artifacts.length ? '\n产物：' + t.artifacts.join(', ') : ''}`));
          for (const event of g.events) details.append(el('div', {class:'muted'}, `${event.created_at.slice(0,19)} ${event.message}`));
          contentBox.append(el('div', {class:'card', style:'padding:12px; margin-bottom:10px;'},
            el('strong', {}, g.description), el('div', {class:'muted'},
              `${labels[g.status] || g.status} · 已验收 ${Math.round(g.progress * 100)}% · 调用 ${g.call_count}/${g.max_calls}`),
            el('p', {}, '授权范围：' + g.scope), el('p', {}, '验收标准：' + g.completion_criteria),
            details, actions));
        }
      } else if (currentTab === 'newGoal') {
        contentBox.replaceChildren();
        const field = (placeholder, multiline=false) => el(multiline ? 'textarea' : 'input',
          {class:'agent-input', placeholder, style:'width:100%; min-height:42px; margin-bottom:10px;'});
        const description = field('长期目标，例如：维护并重构我的代码仓库');
        const scope = field('授权范围，例如：仅修改指定工程目录；不发布、不操作账号');
        const criteria = field('总体验收标准');
        const stages = field('阶段计划：每行“标题 | 执行说明”。按顺序执行，使用已有电脑权限。', true);
        stages.style.minHeight = '100px';
        const category = el('select', {class:'agent-select', style:'width:100%; margin-bottom:10px;'},
          ...[['general','通用任务（人工验收）'],['code','代码开发'],['file','文件操作'],['data','数据分析'],['research','研究（证据验收）'],['browser','浏览器自动化']]
            .map(([value, text]) => el('option', {value}, text)));
        const calls = field('模型调用次数上限'); calls.type = 'number'; calls.min = '1'; calls.value = '100';
        const tokens = field('总词元预算（0 为不限）'); tokens.type = 'number'; tokens.min = '0'; tokens.value = '100000';
        const submit = el('button', {class:'primary'}, '授权并创建目标');
        submit.onclick = async () => {
          submit.disabled = true;
          try {
            const milestones = stages.value.split(/\r?\n/).filter(line => line.trim()).map(line => {
              const index = line.indexOf('|');
              if (index < 1) throw new Error('每行填写：阶段标题、竖线、执行说明');
              return {title:line.slice(0,index).trim(), description:line.slice(index+1).trim(), category:category.value};
            });
            await api(`friend/${qq}/agent_goal_action`, {action:'create', description:description.value,
              scope:scope.value, completion_criteria:criteria.value, milestones,
              max_calls:Number(calls.value), token_budget:Number(tokens.value)});
            tabGoals.click(); toast('目标已创建，按当前好友工具权限执行');
          } catch (err) { toast(err.message); }
          finally { submit.disabled = false; }
        };
        const propose = el('button', {}, '先让 AI 生成阶段草案');
        const autoRun = el('button', {class:'primary'}, 'AI 规划并自动执行');
        const runPlanning = async autoStart => {
          propose.disabled = true;
          autoRun.disabled = true;
          try {
            await api(`friend/${qq}/agent_goal_action`, {action:'propose', description:description.value,
              scope:scope.value, completion_criteria:criteria.value,
              max_calls:Number(calls.value), token_budget:Number(tokens.value), auto_start:autoStart});
            tabTasks.click(); toast(autoStart ? '已授权 AI 在上述范围内规划并执行，可随时暂停' : '草案已入队，确认后开始执行');
          } catch (err) { toast(err.message); }
          finally { propose.disabled = false; autoRun.disabled = false; }
        };
        propose.onclick = () => runPlanning(false);
        autoRun.onclick = () => runPlanning(true);
        contentBox.append(el('p', {class:'muted'}, '确认规划后入队，调用次数和词元预算分配到各阶段，并遵守项目权限。'),
          description, scope, criteria, stages, category,
          el('label', {}, '模型调用次数上限'), calls, el('label', {}, '词元预算（估算与实际用量分别记录）'), tokens, el('p', {class:'muted'}, 'AI 规划最多 2 次调用；规划额度不超过 32000 Token 或所设总预算，执行阶段按预算分配。'), autoRun, propose, submit);
      } else if (currentTab === 'approvals') {
        const res = await api(`friend/${qq}/agent_approvals`);
        const approvals = res.approvals || [];
        contentBox.replaceChildren();

        if (approvals.length === 0) {
          contentBox.append(el('div', {class: 'card', style: 'text-align:center; padding:24px; color:var(--on-surface-variant);'}, '暂无待审批的敏感操作'));
          return;
        }

        for (const a of approvals) {
          const aCard = el('div', {class: 'card', style: 'background: rgba(239, 68, 68, 0.05); border: 1px solid rgba(239, 68, 68, 0.2); padding: 12px; margin-bottom: 10px; border-radius: 12px;'},
            el('div', {style: 'font-weight:600; color: #dc2626; font-size:13px;'}, `待处理 · 待审批操作类型：${a.category}`),
            el('div', {style: 'font-size:13px; margin: 6px 0; color:var(--on-surface);'}, a.description),
            el('div', {class: 'muted', style: 'font-size:11px; font-family:monospace;'}, `详情：${JSON.stringify(a.details)}`),
            el('div', {style: 'display:flex; gap:8px; justify-content:flex-end; margin-top:10px;'},
              el('button', {class: 'agent-icon-btn', style: 'color:#dc2626;', onclick: async () => {
                await api(`friend/${qq}/agent_approval_decision`, {req_id: a.req_id, decision: 'reject'});
                toast('已拒绝');
                renderContent();
              }}, '拒绝 拒绝'),
              el('button', {class: 'agent-icon-btn', style: 'color:var(--primary); font-weight:600;', onclick: async () => {
                await api(`friend/${qq}/agent_approval_decision`, {req_id: a.req_id, decision: 'approve', allowed_scope: 'task'});
                toast('已对当前任务授权');
                renderContent();
              }}, '允许本任务'),
              el('button', {class: 'primary', style: 'min-height:30px; font-size:12px;', onclick: async () => {
                await api(`friend/${qq}/agent_approval_decision`, {req_id: a.req_id, decision: 'approve', allowed_scope: 'once'});
                toast('已允许一次');
                renderContent();
              }}, '允许一次')
            )
          );
          contentBox.append(aCard);
        }

      } else if (currentTab === 'new') {
        contentBox.replaceChildren();
        const titleInput = el('input', {class: 'agent-input', placeholder: '任务标题，例如：优化首页响应速度', style: 'width:100%; min-height:40px; margin-bottom:10px;'});
        const descInput = el('textarea', {class: 'agent-input', placeholder: '任务说明、目标产物与验收标准…', style: 'width:100%; min-height:90px; margin-bottom:10px; resize:vertical;'});
        const catSelect = el('select', {class: 'agent-select', style: 'width:100%; min-height:40px; margin-bottom:14px;'},
          el('option', {value: 'code'}, '代码开发（自动构建与测试）'),
          el('option', {value: 'research'}, '深度研究（分阶段验收）'),
          el('option', {value: 'browser'}, '浏览器自动化（请在说明中写明真实 URL）'),
          el('option', {value: 'data'}, '结构化数据任务'),
          el('option', {value: 'file'}, '文件生成与操作'),
          el('option', {value: 'general'}, '通用自主任务')
        );

        const submitBtn = el('button', {class: 'primary', style: 'width:100%; min-height:42px; font-weight:600;'}, '提交到后台执行');
        submitBtn.onclick = async () => {
          const t = titleInput.value.trim();
          const d = descInput.value.trim();
          if (!t) { toast('请填写任务标题'); return; }
          submitBtn.disabled = true;
          try {
            const res = await api(`friend/${qq}/agent_task_action`, {
              action: 'create',
              title: t,
              description: d || t,
              category: catSelect.value,
              priority: 50
            });
            toast('任务已创建并进入后台队列');
            currentTab = 'tasks';
            tabTasks.classList.add('primary');
            tabNew.classList.remove('primary');
            renderContent();
          } catch (e) {
            toast('创建任务失败：' + e.message);
          } finally {
            submitBtn.disabled = false;
          }
        };

        const form = el('div', {class: 'card', style: 'padding:14px; border-radius:12px;'},
          el('div', {style: 'font-weight:600; margin-bottom:6px; font-size:13px;'}, '任务标题'),
          titleInput,
          el('div', {style: 'font-weight:600; margin-bottom:6px; font-size:13px;'}, '详细任务说明'),
          descInput,
          el('div', {style: 'font-weight:600; margin-bottom:6px; font-size:13px;'}, '任务类型'),
          catSelect,
          submitBtn
        );
        contentBox.append(form);
      }
    } catch (err) {
      contentBox.replaceChildren(el('div', {class: 'card', style: 'color:#dc2626; padding:16px;'}, '加载失败：' + err.message));
    }
  };

  const tabTasks = el('button', {}, '任务');
  const tabAppr = el('button', {}, '审批');
  const tabNew = el('button', {}, '新建任务');
  const tabGoals = el('button', {}, '长期目标');
  const tabNewGoal = el('button', {}, '新建目标');
  for (const [button, tab] of [[tabTasks,'tasks'],[tabAppr,'approvals'],[tabNew,'new'],[tabGoals,'goals'],[tabNewGoal,'newGoal']]) {
    button.style.cssText = 'flex:0 0 auto; min-height:36px; font-size:13px; padding:0 14px; white-space:nowrap;';
    button.onclick = () => {
      currentTab = tab;
      for (const item of [tabTasks,tabAppr,tabNew,tabGoals,tabNewGoal]) item.classList.toggle('primary', item === button);
      renderContent();
    };
  }
  tabTasks.classList.add('primary');

  const closeBtn = el('button', {class: 'agent-icon-btn', style: 'font-size:13px; font-weight:600;'}, '返回');
  closeBtn.onclick = () => render();

  const headerRow = el('div', {style: 'display:flex; justify-content:space-between; align-items:center; margin-bottom:12px;'},
    el('h2', {style: 'font-size: 16px; margin:0;'}, '任务与审批中心'),
    closeBtn
  );

  const navRow = el('div', {class: 'row task-tabs', style: 'gap: 8px; margin-bottom: 12px;'}, tabTasks, tabAppr, tabNew, tabGoals, tabNewGoal);

  show(card('', headerRow, navRow, contentBox));
  renderContent();
}

const PAGE_VIEWS = {background: backgroundPage, agent: agentPage, collab: collabPage, study: studyPage, workflows: workflowsPage, status: statusPage, chat: chatPage, proactive: proactivePage, memory: memoryPage, more: morePage,
                    basic: basicPage, style: stylePage, voice: voicePage, topics: topicsPage, stickers: stickersPage, template: templatePage,
                    model: modelPage, emotion: emotionPage, context: contextPage};

function button(text, work) {
  const node = el('button', {}, text);
  node.onclick = () => act(node, work);
  return node;
}

function researchText(kind, run) {
  run = run || {};
  const labels = {running: '正在整理', ready: '已就绪', failed: '失败', no_interests: '没有匹配的兴趣'};
  let text = labels[run.status] || '尚未整理';
  if (run.at) text += ' · ' + new Date(run.at * 1000).toLocaleString('zh-CN', {month: '2-digit', day: '2-digit', hour: '2-digit', minute: '2-digit'});
  if (run.topics) text += ' · ' + run.topics.join(', ') + `，新增 ${run.added || 0} 条`;
  if (run.error) text += ' · ' + run.error;
  if (run.next_refresh) text += ' · 下次：' + new Date(run.next_refresh * 1000).toLocaleString('zh-CN', {month: '2-digit', day: '2-digit', hour: '2-digit', minute: '2-digit'});
  return text;
}

document.getElementById('reload').onclick = () => render().catch(error => toast(error.message));
// 2026-10-12 user: inside the phone app its own top bar replaces this header and calls houseRefresh
if (new URLSearchParams(location.search).has('app')) document.body.classList.add('in-app');
window.houseRefresh = () => render().catch(error => toast(error.message));
window.addEventListener('hashchange', () => { readToken(); openHouse().catch(error => toast(error.message)); });  // scanned again while open
readToken();
if (!token) show(card('需要配对', el('div', {}, '请在电脑端进入状态与远程连接，扫描手机配对二维码。')));
else openHouse().catch(error => show(card('无法连接电脑', el('div', {}, error.message), el('div', {class: 'muted'}, '请确认电脑上的应用正在运行，且当前使用的局域网、组网或转发连接可达。'))));
timer = setInterval(() => {  // the status tab follows the bridge; other tabs are refreshed by hand
  if (!document.hidden && view.name === 'friend' && view.tab === 'status') render().catch(() => {});
}, 10000);
</script>
